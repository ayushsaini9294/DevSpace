# Publishes the demo build of the web app (sample data, no server) to GitHub Pages:
# https://ayushsaini9294.github.io/DevSpace/
# One-time setup in the repository: Settings → Pages → Source: GitHub Actions.
name: Demo site

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'package-lock.json'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Build the demo
        run: npm run build -w @devspace/web
        env:
          VITE_DEMO: '1'
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_DEMO_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          VITE_DEMO_VIDEO_URL: ${{ vars.DEMO_VIDEO_URL }}
      # GitHub Pages has no single-page fallback: its 404 page is the app itself.
      - run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
