name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: devspace
          POSTGRES_PASSWORD: devspace
          POSTGRES_DB: devspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devspace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CI: true
      DATABASE_URL: postgresql://devspace:devspace@localhost:5432/devspace

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w @devspace/api

      - name: Apply database migrations
        run: npm run db:deploy -w @devspace/api

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # IDE containers (Phase 5): the image, its network and firewall, then a check on a real
      # container that the image works when locked down and that the network is isolated.
      - name: Build IDE image
        run: npm run ide:build

      - name: Create IDE network
        run: bash scripts/ide-network.sh

      - name: Apply IDE firewall
        run: sudo bash scripts/ide-firewall.sh

      - name: Check IDE container and isolation
        run: bash scripts/ide-check.sh

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          # Projects' bare Git repositories (Phase 4), kept out of the checkout; the API creates
          # the folder. Set per step because `runner` isn't available in job-level env.
          REPOS_DIR: ${{ runner.temp }}/devspace-repos

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
