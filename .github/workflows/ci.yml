name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: devspace
          POSTGRES_PASSWORD: devspace
          POSTGRES_DB: devspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devspace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # BullMQ queues for the worker (Phase 5 idle IDE stop and disk checks; Phase 7 copy updates).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CI: true
      DATABASE_URL: postgresql://devspace:devspace@localhost:5432/devspace
      # The API's two listeners (Phase 5, IDE on its own site). These equal the API's defaults and
      # are set here so CI states them: the app on localhost, the IDE on 127.0.0.1 (another site).
      PORT: 3000
      APP_ORIGIN: http://localhost:5173
      IDE_PORT: 3100
      IDE_HOST: 127.0.0.1
      IDE_ORIGIN: http://127.0.0.1:3100

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w @devspace/api

      - name: Apply database migrations
        run: npm run db:deploy -w @devspace/api

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # IDE containers (Phase 5): the image, its network and firewall, then a check on a real
      # container that the image works when locked down and that the network is isolated. Before
      # the unit tests, so the API's real-container tests run instead of skipping.
      - name: Build IDE image
        run: npm run ide:build

      - name: Create IDE network
        run: bash scripts/ide-network.sh

      - name: Apply IDE firewall
        run: sudo bash scripts/ide-firewall.sh

      - name: Check IDE container and isolation
        run: bash scripts/ide-check.sh

      - name: Unit tests
        run: npm test
        env:
          COPIES_DIR: ${{ runner.temp }}/devspace-copies-unit

      - name: Check the app's ports are free
        run: bash scripts/check-ports.sh

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          # Projects' bare Git repositories (Phase 4), kept out of the checkout; the API creates
          # the folder. Set per step because `runner` isn't available in job-level env.
          # e2e/submissions.spec.ts, merge.spec.ts and tasks.spec.ts read it to check snapshots and main with git
          # (Phases 6 to 8).
          REPOS_DIR: ${{ runner.temp }}/devspace-repos
          # Members' copies (Phase 5). e2e/ide.spec.ts, submissions.spec.ts, merge.spec.ts and tasks.spec.ts read
          # the same variable; the specs write files into copies as the runner user, the same user
          # the API and worker run as, so ownership matches without any chown.
          # `npm run dev` passes both variables to the API and to the worker, which updates copies
          # after a merge or undo (Phase 7, automatic mode), so both see the same folders.
          COPIES_DIR: ${{ runner.temp }}/devspace-copies

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
